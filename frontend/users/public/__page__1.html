<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./assets/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>IMF AutoML — Page Name</title>

    <link rel="stylesheet" href="./assets/css/pages/__page__1.css">
</head>

<!--
    PAGE TYPE: PUBLIC
    ─────────────────────────────────────────────────────────────────────────────
    Public page layout:
      · <aside> is ABSENT — sidebar is only on dashboard/course pages
      · <header> and <footer> are always empty shells — JS injects content
      · Navbar: mountPublicNavbar()

    PAGE TYPE: DASHBOARD (authenticated, with sidebar)
    ─────────────────────────────────────────────────────────────────────────────
    Dashboard page layout (swap <main> block below):

      <main>
          <aside></aside>
          <div class="page-content">
              <section id="page-header"></section>
              <section id="page-body"  ></section>
          </div>
      </main>

      · <aside> goes INSIDE <main>, before .page-content
      · Use <section> tags (not <div>) for named regions inside .page-content
      · Section IDs use kebab-case: "dashboard-kpis", "courses-header"
      · Navbar: mountDashboardNavbar() + mountStudentSidebar() or mountCourseSidebar()
-->

<body>

    <header></header>

    <main>

        <!--
            SECTION ID NAMING
            ─────────────────────────────────────────────────────────────────────
            Public pages  → camelCase IDs:  hero, statsBar, featuredItems, howItWorks
            Dashboard pages → kebab-case IDs: page-header, page-body, items-table
            Split sections  → parentId-childRole: itemsSection-filters, itemsSection-content

            DATA-SPINNER
            ─────────────────────────────────────────────────────────────────────
            Add data-spinner only to sections whose content comes from an API call.
            scripts.js injects a spinner into every [data-spinner] element on page load.
            JS replaces innerHTML when data is ready, removing the spinner automatically.
            Omit data-spinner on sections that render immediately (static HTML, no fetch).
        -->

        <!-- Fetches dynamic data → data-spinner -->
        <div id="hero"        data-spinner></div>
        <div id="statsBar"    data-spinner></div>
        <div id="itemsSection" data-spinner></div>

        <!-- Split: outer has no spinner; only the content child that fetches does -->
        <div id="filteredSection">
            <div id="filteredSection-filters"></div>
            <div id="filteredSection-content" data-spinner></div>
        </div>

        <!-- No data-spinner: form HTML rendered immediately, no API fetch on load -->
        <div id="formSection"></div>

        <!-- No data-spinner: pure static HTML -->
        <div id="howItWorks"></div>
        <div id="ctaSection"></div>

    </main>

    <footer></footer>

    <!--
        SCRIPT LOAD ORDER — must be exactly this order:
        1. config.js     — defines window.APP_CONFIG (API base URL, env, locales, currencies)
                           Must load before ANY module — modules read APP_CONFIG on import
        2. scripts.js    — global DOM init: spinner setup, dropdown close handling, MutationObserver
                           Non-module, runs synchronously before page module
        3. __page__1.js   — page module (type="module", deferred by default)
    -->
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/scripts.js"></script>
    <script type="module" src="./assets/js/pages/__page__1.js"></script>

</body>

</html>
